name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Type Checking & Linting
        run: |
          pip install flake8 mypy
          flake8 src/ || echo "Linting finished"
          mypy src/ --ignore-missing-imports || echo "Type checking finished"

      - name: Run Unit Tests
        run: |
          PYTHONPATH=. pytest tests/ -v

      - name: Build Docker Image
        run: docker build -t ai-loan-advisory-agent:latest .
